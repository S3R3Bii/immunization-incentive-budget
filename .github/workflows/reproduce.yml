name: Reproduce results
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check published results, rebuild and independently check again
        run: |
          python verify.py
          python analyze.py
          python verify.py
          git diff --exit-code -- 'results/*.csv'
